name: oilflood
channels:
  - conda-forge
dependencies:
  - python=3.11
  - opendrift
  - adios_db
  - xarray
  - netcdf4
  - cartopy
  - shapely
  - scikit-learn=1.9   # our ML drift correction (drift_model.joblib was saved with 1.9.1)
  - joblib
  - pillow         # global current PNG fields
  - pyshp          # data/ fetch scripts (DWH outlines)
  - pyproj
  - requests
  - pip
  - pip:
      - fastapi
      - uvicorn[standard]
      - requests
